<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="fragments/layout :: styles"></th:block>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PharmaCore - Domicilios</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" th:href="@{/img/img.png}">
    <script>
        tailwind.config = {
            theme: { extend: { colors: { pharmacore: { bg:'#F7FAF9', dark:'#004B4B', darker:'#003939', accent:'#006565', text:'#1E1E1E' } }, fontFamily: { sans: ['Poppins','sans-serif'] } } }
        }
    </script>
</head>
<body class="bg-pharmacore-bg font-sans text-pharmacore-text antialiased min-h-screen flex flex-col selection:bg-pharmacore-accent selection:text-white">

<header th:replace="~{fragments/layout :: topbar('Domicilios')}"></header>

<div class="flex flex-1 relative min-h-[calc(100vh-4rem)]">
    <div id="overlay" onclick="toggleSidebar()" class="fixed inset-0 bg-slate-900/60 z-10 hidden md:hidden transition-all duration-300"></div>
    <aside th:replace="~{fragments/layout :: sidebar('domicilios')}"></aside>

    <div class="flex-1 flex flex-col min-w-0 bg-pharmacore-bg">
        <main class="flex-1 p-4 sm:p-6 lg:p-8">

            <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 mb-6">
                <div>
                    <h1 class="text-xl sm:text-2xl font-bold text-pharmacore-dark uppercase tracking-wide">DOMICILIOS</h1>
                    <p class="text-xs sm:text-sm text-slate-500">Pedidos a domicilio y su estado de entrega.</p>
                </div>
                <a th:href="@{/view/domicilios/form}" class="bg-pharmacore-accent text-white px-4 py-2 rounded-xl text-xs font-semibold hover:opacity-90 transition-opacity">+ Nuevo Domicilio</a>
            </div>

            <div th:if="${mensaje}" class="bg-emerald-50 text-emerald-700 border border-emerald-200 p-3 mb-4 rounded-xl text-sm" th:text="${mensaje}"></div>
            <div th:if="${error}" class="bg-red-50 text-red-700 border border-red-200 p-3 mb-4 rounded-xl text-sm" th:text="${error}"></div>

            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                <div class="p-4 sm:p-6 border-b border-slate-100">
                    <span class="text-xs sm:text-sm font-medium text-slate-600">
                        Total registros: <span class="font-bold text-pharmacore-dark" th:text="${#lists.size(domicilios)}">0</span>
                    </span>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-sm text-left">
                        <thead class="bg-pharmacore-dark text-white text-xs uppercase tracking-wider">
                        <tr>
                            <th class="p-4">Venta</th>
                            <th class="p-4">Cliente</th>
                            <th class="p-4">Dirección</th>
                            <th class="p-4">Domiciliario</th>
                            <th class="p-4">Estado</th>
                            <th class="p-4 text-center">Acciones</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:if="${#lists.isEmpty(domicilios)}">
                            <td colspan="6" class="p-6 text-center text-slate-400 text-xs">No hay domicilios registrados todavía.</td>
                        </tr>
                        <tr th:each="d : ${domicilios}" class="border-b border-slate-100 hover:bg-slate-50 transition-colors">
                            <td class="p-4 text-xs font-mono text-slate-600" th:text="${numerosFactura.get(d.idVenta) ?: ('#' + d.idVenta)}"></td>
                            <td class="p-4 text-xs" th:text="${nombresClientes.get(d.idCliente) ?: ('Cliente #' + d.idCliente)}"></td>
                            <td class="p-4 text-xs text-slate-600" th:text="${d.direccionEntrega}"></td>
                            <td class="p-4 text-xs text-slate-600" th:text="${d.nombreDomiciliario ?: '—'}"></td>
                            <td class="p-4">
                                <span class="px-2 py-1 rounded-full text-[10px] font-bold"
                                      th:classappend="${
                                        d.estado == 'ENTREGADO' ? 'bg-emerald-50 text-emerald-700' :
                                        (d.estado == 'CANCELADO' ? 'bg-red-50 text-red-700' :
                                        (d.estado == 'EN_CAMINO' ? 'bg-blue-50 text-blue-700' :
                                        (d.estado == 'EN_PREPARACION' ? 'bg-amber-50 text-amber-700' : 'bg-slate-100 text-slate-600')))
                                      }"
                                      th:text="${#strings.replace(d.estado, '_', ' ')}"></span>
                            </td>
                            <td class="p-4 text-center whitespace-nowrap">
                                <div th:if="${d.estado != 'ENTREGADO' and d.estado != 'CANCELADO'}" class="flex items-center justify-center gap-2">
                                    <form th:action="@{/view/domicilios/estado/{id}(id=${d.idDomicilio})}" method="post" class="inline">
                                        <input type="hidden" name="nuevoEstado" th:value="${
                                            d.estado == 'PENDIENTE' ? 'EN_PREPARACION' :
                                            (d.estado == 'EN_PREPARACION' ? 'EN_CAMINO' : 'ENTREGADO')
                                        }">
                                        <button type="submit" class="text-pharmacore-accent font-semibold hover:underline" th:text="${
                                            d.estado == 'PENDIENTE' ? 'Preparar' :
                                            (d.estado == 'EN_PREPARACION' ? 'Enviar' : 'Marcar entregado')
                                        }"></button>
                                    </form>
                                    <form th:action="@{/view/domicilios/estado/{id}(id=${d.idDomicilio})}" method="post" class="inline">
                                        <input type="hidden" name="nuevoEstado" value="CANCELADO">
                                        <button type="submit" class="text-red-600 font-semibold hover:underline" onclick="return confirm('¿Cancelar este domicilio?');">Cancelar</button>
                                    </form>
                                </div>
                                <span th:if="${d.estado == 'ENTREGADO' or d.estado == 'CANCELADO'}" class="text-slate-300 text-xs">—</span>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </main>
        <footer th:replace="~{fragments/layout :: footer}"></footer>
    </div>
</div>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
