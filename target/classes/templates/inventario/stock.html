<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="fragments/layout :: styles"></th:block>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PharmaCore - Consulta de Stock</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" th:href="@{/img/img.png}">
    <script>
        tailwind.config = {
            theme: { extend: { colors: { pharmacore: { bg:'#F7FAF9', dark:'#004B4B', darker:'#003939', accent:'#006565', text:'#1E1E1E' } }, fontFamily: { sans: ['Poppins','sans-serif'] } } }
        }
    </script>
</head>
<body class="bg-pharmacore-bg font-sans text-pharmacore-text antialiased min-h-screen flex flex-col selection:bg-pharmacore-accent selection:text-white">

<header th:replace="~{fragments/layout :: topbar('Consulta de Stock')}"></header>

<div class="flex flex-1 relative min-h-[calc(100vh-4rem)]">
    <div id="overlay" onclick="toggleSidebar()" class="fixed inset-0 bg-slate-900/60 z-10 hidden md:hidden transition-all duration-300"></div>
    <aside th:replace="~{fragments/layout :: sidebar('inventario')}"></aside>

    <div class="flex-1 flex flex-col min-w-0 bg-pharmacore-bg">
        <main class="flex-1 p-4 sm:p-6 lg:p-8">

            <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 mb-6">
                <div>
                    <h1 class="text-xl sm:text-2xl font-bold text-pharmacore-dark uppercase tracking-wide">CONSULTA DE STOCK</h1>
                    <p class="text-xs sm:text-sm text-slate-500">Filtre el inventario actual por categoría, proveedor o ubicación en estante.</p>
                </div>
                <div class="bg-white rounded-xl border border-amber-200 px-4 py-2 text-xs">
                    <span class="text-amber-700 font-semibold" th:text="${totalStockBajo}"></span>
                    <span class="text-slate-500"> producto(s) con stock bajo en total</span>
                </div>
            </div>

            <form method="get" th:action="@{/view/inventario/stock}" class="bg-white rounded-2xl shadow-sm border border-slate-200 p-4 sm:p-6 mb-6 grid grid-cols-1 sm:grid-cols-5 gap-4 items-end">
                <div>
                    <label class="block text-[10px] font-semibold text-slate-700 uppercase tracking-wider mb-1">Categoría</label>
                    <select name="idCategoria" class="w-full px-3 py-2 text-xs bg-slate-50 border border-slate-200 rounded-lg">
                        <option value="">Todas</option>
                        <option th:each="c : ${categorias}" th:value="${c.id_categoria}" th:text="${c.nombre}"
                                th:selected="${param.idCategoria != null and param.idCategoria[0] == c.id_categoria.toString()}"></option>
                    </select>
                </div>
                <div>
                    <label class="block text-[10px] font-semibold text-slate-700 uppercase tracking-wider mb-1">Proveedor</label>
                    <select name="idProveedor" class="w-full px-3 py-2 text-xs bg-slate-50 border border-slate-200 rounded-lg">
                        <option value="">Todos</option>
                        <option th:each="p : ${proveedores}" th:value="${p.id_proveedor}" th:text="${p.razon_social}"
                                th:selected="${param.idProveedor != null and param.idProveedor[0] == p.id_proveedor.toString()}"></option>
                    </select>
                </div>
                <div>
                    <label class="block text-[10px] font-semibold text-slate-700 uppercase tracking-wider mb-1">Ubicación</label>
                    <input type="text" name="ubicacion" th:value="${param.ubicacion != null ? param.ubicacion[0] : ''}" placeholder="Ej: Estante A1" class="w-full px-3 py-2 text-xs bg-slate-50 border border-slate-200 rounded-lg">
                </div>
                <div class="flex items-center gap-2">
                    <input type="checkbox" id="soloStockBajo" name="soloStockBajo" value="true"
                           th:checked="${param.soloStockBajo != null and param.soloStockBajo[0] == 'true'}">
                    <label for="soloStockBajo" class="text-xs text-slate-600">Solo stock bajo</label>
                </div>
                <div>
                    <button type="submit" class="w-full bg-pharmacore-accent text-white px-4 py-2 rounded-xl text-xs font-semibold hover:opacity-90 transition-opacity cursor-pointer">Filtrar</button>
                </div>
            </form>

            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                <div class="p-4 sm:p-6 border-b border-slate-100">
                    <span class="text-xs sm:text-sm font-medium text-slate-600">
                        Resultados: <span class="font-bold text-pharmacore-dark" th:text="${#lists.size(productos)}">0</span>
                    </span>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-sm text-left">
                        <thead class="bg-pharmacore-dark text-white text-xs uppercase tracking-wider">
                        <tr>
                            <th class="p-4">Producto</th>
                            <th class="p-4">Categoría</th>
                            <th class="p-4">Proveedor</th>
                            <th class="p-4">Ubicación</th>
                            <th class="p-4">Stock Actual</th>
                            <th class="p-4">Stock Mínimo</th>
                            <th class="p-4">Estado</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:if="${#lists.isEmpty(productos)}">
                            <td colspan="7" class="p-6 text-center text-slate-400 text-xs">No hay productos que coincidan con el filtro.</td>
                        </tr>
                        <tr th:each="p : ${productos}" class="border-b border-slate-100 hover:bg-slate-50 transition-colors">
                            <td class="p-4 text-xs font-semibold text-slate-700" th:text="${p.nombreComercial}"></td>
                            <td class="p-4 text-xs text-slate-600" th:text="${p.categoria != null ? p.categoria.nombre : '—'}"></td>
                            <td class="p-4 text-xs text-slate-600" th:text="${p.proveedor != null ? p.proveedor.razon_social : '—'}"></td>
                            <td class="p-4 text-xs text-slate-600" th:text="${p.ubicacionEstante ?: '—'}"></td>
                            <td class="p-4 text-xs font-bold text-pharmacore-dark" th:text="${p.stockTotal}"></td>
                            <td class="p-4 text-xs text-slate-500" th:text="${p.stockMinimo}"></td>
                            <td class="p-4 text-xs">
                                <span th:text="${p.stockBajo ? 'STOCK BAJO' : 'OK'}"
                                      th:classappend="${p.stockBajo} ? 'bg-red-100 text-red-700' : 'bg-emerald-100 text-emerald-700'"
                                      class="inline-block px-2 py-0.5 rounded-full text-[10px] font-semibold"></span>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </main>
        <footer th:replace="~{fragments/layout :: footer}"></footer>
    </div>
</div>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
