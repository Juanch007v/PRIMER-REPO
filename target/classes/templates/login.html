<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PharmaCore - Iniciar Sesión</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" th:href="@{/img/img.png}">
    <script>
        tailwind.config = {
            theme: { extend: { colors: { pharmacore: { bg:'#F7FAF9', dark:'#004B4B', darker:'#003939', accent:'#006565', text:'#1E1E1E' } }, fontFamily: { sans: ['Poppins','sans-serif'] } } }
        }
    </script>
</head>
<body class="bg-pharmacore-dark font-sans text-pharmacore-text antialiased min-h-screen flex items-center justify-center p-4">

<div class="w-full max-w-sm">
    <div class="text-center mb-8">
        <h1 class="text-2xl font-bold text-white uppercase tracking-wide">PHARMACORE</h1>
        <p class="text-xs text-white/60 mt-1">Sistema de gestión de farmacia</p>
    </div>

    <div class="bg-white rounded-2xl shadow-lg p-6 sm:p-8">
        <h2 class="text-sm font-bold text-pharmacore-dark uppercase tracking-wider mb-6 text-center">Iniciar Sesión</h2>

        <div th:if="${param.error}" class="bg-red-50 text-red-700 border border-red-200 p-3 mb-4 rounded-xl text-xs">
            Usuario o contraseña incorrectos, o el usuario está bloqueado/inactivo.
        </div>
        <div th:if="${param.logout}" class="bg-emerald-50 text-emerald-700 border border-emerald-200 p-3 mb-4 rounded-xl text-xs">
            Sesión cerrada correctamente.
        </div>

        <form th:action="@{/login}" method="post" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-2">Usuario</label>
                <input type="text" name="username" autofocus class="w-full px-4 py-2.5 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-pharmacore-accent transition-all" required>
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-2">Contraseña</label>
                <input type="password" name="password" class="w-full px-4 py-2.5 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-pharmacore-accent transition-all" required>
            </div>
            <button type="submit" class="w-full bg-pharmacore-accent text-white py-2.5 rounded-xl text-sm font-semibold hover:opacity-90 transition-opacity cursor-pointer">
                Entrar
            </button>
        </form>
    </div>

    <p class="text-center text-[10px] text-white/40 mt-6">PharmaCore © 2026</p>
</div>

</body>
</html>
