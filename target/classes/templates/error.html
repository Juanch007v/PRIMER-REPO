<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PharmaCore - Ocurrió un error</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" th:href="@{/img/img.png}">
    <script>
        tailwind.config = {
            theme: { extend: { colors: { pharmacore: { bg:'#F7FAF9', dark:'#004B4B', darker:'#003939', accent:'#006565', text:'#1E1E1E' } }, fontFamily: { sans: ['Poppins','sans-serif'] } } }
        }
    </script>
    <!--
        Esta página NO extiende fragments/layout.html a propósito: si algo ya salió mal
        (por eso llegamos aquí), lo último que queremos es que el propio fragmento de
        layout (que depende de que haya sesión, roles, etc.) también falle al renderizar.
        Se mantiene autocontenida y a prueba de fallos.
    -->
</head>
<body class="bg-pharmacore-bg font-sans text-pharmacore-text antialiased min-h-screen flex items-center justify-center p-6">

    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-8 sm:p-10 max-w-md w-full text-center">
        <div class="w-14 h-14 rounded-2xl bg-red-50 text-red-500 flex items-center justify-center mx-auto mb-5">
            <svg class="w-7 h-7" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m0 3.75h.008v.008H12v-.008zM21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
            </svg>
        </div>

        <p class="text-xs font-bold text-pharmacore-accent uppercase tracking-wider mb-1"
           th:text="${status != null ? 'Error ' + status : 'Error'}">Error</p>
        <h1 class="text-lg sm:text-xl font-bold text-pharmacore-dark mb-3">Ocurrió un problema al procesar tu solicitud</h1>
        <p class="text-sm text-slate-500 mb-6"
           th:text="${message != null and !#strings.isEmpty(message) ? message : 'Intenta de nuevo en unos segundos. Si el problema persiste, contacta al administrador del sistema.'}">
            Intenta de nuevo en unos segundos.
        </p>

        <a th:href="@{/view/home}" class="inline-block bg-pharmacore-accent text-white px-5 py-2.5 rounded-xl text-xs font-semibold hover:opacity-90 transition-opacity">
            Volver al inicio
        </a>
    </div>

</body>
</html>
