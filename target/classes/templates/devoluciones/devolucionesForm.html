<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="fragments/layout :: styles"></th:block>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PharmaCore - Nueva Devolución</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" th:href="@{/img/img.png}">
    <script>
        tailwind.config = {
            theme: { extend: { colors: { pharmacore: { bg:'#F7FAF9', dark:'#004B4B', darker:'#003939', accent:'#006565', text:'#1E1E1E' } }, fontFamily: { sans: ['Poppins','sans-serif'] } } }
        }
    </script>
</head>
<body class="bg-pharmacore-bg font-sans text-pharmacore-text antialiased min-h-screen flex flex-col selection:bg-pharmacore-accent selection:text-white">

<header th:replace="~{fragments/layout :: topbar('Devoluciones')}"></header>

<div class="flex flex-1 relative min-h-[calc(100vh-4rem)]">
    <div id="overlay" onclick="toggleSidebar()" class="fixed inset-0 bg-slate-900/60 z-10 hidden md:hidden transition-all duration-300"></div>
    <aside th:replace="~{fragments/layout :: sidebar('devoluciones')}"></aside>

    <div class="flex-1 flex flex-col min-w-0 bg-pharmacore-bg">
        <main class="flex-1 p-4 sm:p-6 lg:p-8 max-w-3xl mx-auto w-full">

            <div class="mb-6 flex items-center justify-between">
                <div>
                    <h1 class="text-xl sm:text-2xl font-bold text-pharmacore-dark uppercase tracking-wide">NUEVA DEVOLUCIÓN</h1>
                    <p class="text-xs sm:text-sm text-slate-500">Registre una devolución de cliente o hacia un proveedor.</p>
                </div>
                <a th:href="@{/view/devoluciones}" class="bg-slate-200 text-slate-700 px-4 py-2 rounded-xl text-xs font-semibold hover:bg-slate-300 transition-colors">← Volver</a>
            </div>

            <div th:if="${error}" class="bg-red-50 text-red-700 border border-red-200 p-3 mb-4 rounded-xl text-sm" th:text="${error}"></div>

            <form th:action="@{/view/devoluciones/guardar}" th:object="${devolucion}" method="post" class="space-y-6">

                <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 sm:p-8">
                    <h2 class="text-xs font-bold text-pharmacore-accent uppercase tracking-wider mb-4">Tipo de Devolución</h2>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                        <div>
                            <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-2">Tipo</label>
                            <select id="tipoDevolucion" th:field="*{tipoDevolucion}" onchange="alternarOrigen()"
                                    class="w-full px-4 py-2.5 text-xs sm:text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-pharmacore-accent transition-all" required>
                                <option value="">Seleccione...</option>
                                <option th:each="t : ${tipos}" th:value="${t}" th:text="${t == 'CLIENTE'} ? 'Devolución de cliente' : 'Devolución a proveedor'"></option>
                            </select>
                        </div>

                        <div id="campo-venta" style="display:none;">
                            <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-2">Venta relacionada (opcional)</label>
                            <select th:field="*{idVenta}" class="w-full px-4 py-2.5 text-xs sm:text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-pharmacore-accent transition-all">
                                <option value="">Sin venta asociada</option>
                                <option th:each="v : ${ventas}" th:value="${v.idVenta}" th:text="${v.numeroFactura}"></option>
                            </select>
                        </div>

                        <div id="campo-compra" style="display:none;">
                            <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-2">Compra relacionada (opcional)</label>
                            <select th:field="*{idCompra}" class="w-full px-4 py-2.5 text-xs sm:text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-pharmacore-accent transition-all">
                                <option value="">Sin compra asociada</option>
                                <option th:each="c : ${compras}" th:value="${c.idCompra}" th:text="${c.numeroFacturaProveedor}"></option>
                            </select>
                        </div>
                    </div>
                </div>

                <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 sm:p-8">
                    <h2 class="text-xs font-bold text-pharmacore-accent uppercase tracking-wider mb-4">Producto Devuelto</h2>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                        <div>
                            <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-2">Producto</label>
                            <select id="idProducto" th:field="*{idProducto}" onchange="filtrarLotes()"
                                    class="w-full px-4 py-2.5 text-xs sm:text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-pharmacore-accent transition-all" required>
                                <option value="">Seleccione un producto</option>
                                <option th:each="p : ${productos}" th:value="${p.idProducto}" th:text="${p.nombreComercial}"></option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-2">Lote (opcional)</label>
                            <select id="idLote" name="idLote" class="w-full px-4 py-2.5 text-xs sm:text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-pharmacore-accent transition-all">
                                <option value="">Sin lote específico (solo ajusta el total)</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-2">Cantidad</label>
                            <input type="number" min="1" th:field="*{cantidad}" class="w-full px-4 py-2.5 text-xs sm:text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-pharmacore-accent transition-all" required>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-2">Motivo</label>
                            <select th:field="*{motivo}" class="w-full px-4 py-2.5 text-xs sm:text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-pharmacore-accent transition-all" required>
                                <option value="">Seleccione...</option>
                                <option th:each="m : ${motivos}" th:value="${m}" th:text="${#strings.replace(m, '_', ' ')}"></option>
                            </select>
                        </div>
                        <div class="sm:col-span-2">
                            <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-2">¿En qué estado queda el producto?</label>
                            <select th:field="*{estadoProducto}" class="w-full px-4 py-2.5 text-xs sm:text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-pharmacore-accent transition-all" required>
                                <option value="">Seleccione...</option>
                                <option th:each="e : ${estadosProducto}" th:value="${e}" th:text="${#strings.replace(e, '_', ' ')}"></option>
                            </select>
                            <p class="text-[11px] text-slate-400 mt-1">
                                "Apto para reingreso" es lo único que vuelve a sumar al stock disponible para la venta.
                            </p>
                        </div>
                    </div>
                    <div class="mt-6">
                        <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-2">Observaciones</label>
                        <textarea th:field="*{observaciones}" rows="3" placeholder="Detalles adicionales de la devolución..." class="w-full px-4 py-2.5 text-xs sm:text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-pharmacore-accent transition-all"></textarea>
                    </div>
                </div>

                <div class="flex items-center justify-end gap-3">
                    <a th:href="@{/view/devoluciones}" class="px-5 py-2.5 rounded-xl text-xs font-semibold text-slate-600 bg-slate-100 hover:bg-slate-200 transition-colors">Cancelar</a>
                    <button type="submit" class="px-5 py-2.5 rounded-xl text-xs font-semibold text-white bg-pharmacore-accent hover:opacity-90 transition-opacity cursor-pointer">Registrar Devolución</button>
                </div>
            </form>

        </main>
        <footer th:replace="~{fragments/layout :: footer}"></footer>
    </div>
</div>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>

<script th:inline="javascript">
    const LOTES = /*[[${lotes}]]*/ [];

    function alternarOrigen() {
        const tipo = document.getElementById('tipoDevolucion').value;
        document.getElementById('campo-venta').style.display = (tipo === 'CLIENTE') ? 'block' : 'none';
        document.getElementById('campo-compra').style.display = (tipo === 'PROVEEDOR') ? 'block' : 'none';
    }

    function filtrarLotes() {
        const idProducto = document.getElementById('idProducto').value;
        const select = document.getElementById('idLote');
        select.innerHTML = '<option value="">Sin lote específico (solo ajusta el total)</option>';
        LOTES.filter(l => String(l.idProducto) === String(idProducto)).forEach(l => {
            const opt = document.createElement('option');
            opt.value = l.idLote;
            opt.textContent = l.numeroLote;
            select.appendChild(opt);
        });
    }

    document.addEventListener('DOMContentLoaded', alternarOrigen);
</script>
</body>
</html>
