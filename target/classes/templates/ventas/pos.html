<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="fragments/layout :: styles"></th:block>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PharmaCore - Nueva Venta</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" th:href="@{/img/img.png}">
    <script>
        tailwind.config = {
            theme: { extend: { colors: { pharmacore: { bg:'#F7FAF9', dark:'#004B4B', darker:'#003939', accent:'#006565', text:'#1E1E1E' } }, fontFamily: { sans: ['Poppins','sans-serif'] } } }
        }
    </script>
</head>
<body class="bg-pharmacore-bg font-sans text-pharmacore-text antialiased min-h-screen flex flex-col selection:bg-pharmacore-accent selection:text-white">

<header th:replace="~{fragments/layout :: topbar('Nueva Venta')}"></header>

<div class="flex flex-1 relative min-h-[calc(100vh-4rem)]">
    <div id="overlay" onclick="toggleSidebar()" class="fixed inset-0 bg-slate-900/60 z-10 hidden md:hidden transition-all duration-300"></div>
    <aside th:replace="~{fragments/layout :: sidebar('ventas')}"></aside>

    <div class="flex-1 flex flex-col min-w-0 bg-pharmacore-bg">
        <main class="flex-1 p-4 sm:p-6 lg:p-8 max-w-5xl mx-auto w-full">

            <div class="mb-6 flex items-center justify-between">
                <div>
                    <h1 class="text-xl sm:text-2xl font-bold text-pharmacore-dark uppercase tracking-wide">NUEVA VENTA</h1>
                    <p class="text-xs sm:text-sm text-slate-500">Registre la dispensación de medicamentos y genere la factura de venta.</p>
                </div>
                <a th:href="@{/view/dispensacion/historial}" class="bg-slate-200 text-slate-700 px-4 py-2 rounded-xl text-xs font-semibold hover:bg-slate-300 transition-colors">Ver historial →</a>
            </div>

            <div th:if="${mensaje}" class="bg-emerald-50 text-emerald-700 border border-emerald-200 p-3 mb-4 rounded-xl text-sm" th:text="${mensaje}"></div>
            <div th:if="${error}" class="bg-red-50 text-red-700 border border-red-200 p-3 mb-4 rounded-xl text-sm" th:text="${error}"></div>
            <div th:if="${param.exito}" class="bg-emerald-50 text-emerald-700 border border-emerald-200 p-3 mb-4 rounded-xl text-sm">Venta registrada correctamente.</div>

            <form th:action="@{/view/ventas/nueva/guardar}" th:object="${venta}" method="post" class="space-y-6" id="form-venta">

                <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 sm:p-8">
                    <h2 class="text-xs font-bold text-pharmacore-accent uppercase tracking-wider mb-4">Datos de la Venta</h2>
                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-6">
                        <div>
                            <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-2">Cliente / Paciente</label>
                            <select th:field="*{idCliente}" class="w-full px-4 py-2.5 text-xs sm:text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-pharmacore-accent transition-all">
                                <option value="">Venta sin cliente registrado</option>
                                <option th:each="c : ${clientes}" th:value="${c.id_cliente}" th:text="${c.nombreCompleto}"></option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-2">Empleado que Atiende</label>
                            <select th:field="*{idEmpleado}" class="w-full px-4 py-2.5 text-xs sm:text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-pharmacore-accent transition-all" required>
                                <option value="">Seleccione un empleado</option>
                                <option th:each="e : ${empleados}" th:value="${e.id_empleado}" th:text="${e.nombre_completo}"></option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-2">Método de Pago</label>
                            <select th:field="*{metodoPago}" class="w-full px-4 py-2.5 text-xs sm:text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-pharmacore-accent transition-all">
                                <option value="EFECTIVO">Efectivo</option>
                                <option value="TARJETA_DEBITO">Tarjeta Débito</option>
                                <option value="TARJETA_CREDITO">Tarjeta Crédito</option>
                                <option value="TRANSFERENCIA">Transferencia</option>
                                <option value="NEQUI_DAVIPLATA">Nequi / Daviplata</option>
                                <option value="PAGO_MIXTO">Pago Mixto</option>
                            </select>
                        </div>
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-6 mt-6">
                        <div>
                            <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-2">Número de Factura</label>
                            <input type="text" th:field="*{numeroFactura}" placeholder="Autogenerado si se deja vacío" class="w-full px-4 py-2.5 text-xs sm:text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-pharmacore-accent transition-all">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-2">Descuento</label>
                            <input type="number" step="0.01" th:field="*{descuento}" class="w-full px-4 py-2.5 text-xs sm:text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-pharmacore-accent transition-all">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-2">IVA</label>
                            <input type="number" step="0.01" th:field="*{impuestoIva}" class="w-full px-4 py-2.5 text-xs sm:text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-pharmacore-accent transition-all">
                        </div>
                    </div>
                </div>

                <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 sm:p-8">
                    <div class="flex items-center justify-between mb-4">
                        <h2 class="text-xs font-bold text-pharmacore-accent uppercase tracking-wider">Medicamentos Dispensados</h2>
                        <button type="button" onclick="agregarLinea()" class="bg-pharmacore-accent/10 text-pharmacore-accent px-3 py-1.5 rounded-lg text-xs font-semibold hover:bg-pharmacore-accent/20 transition-colors">+ Agregar línea</button>
                    </div>

                    <div id="lineas-venta" class="space-y-3"></div>

                    <div class="flex justify-end mt-6 pt-4 border-t border-slate-100">
                        <div class="text-sm font-bold text-pharmacore-dark">
                            Subtotal estimado: <span id="subtotal-total">$0</span>
                        </div>
                    </div>
                </div>

                <div class="flex items-center justify-end gap-3">
                    <a th:href="@{/view/dispensacion/historial}" class="px-5 py-2.5 rounded-xl text-xs font-semibold text-slate-600 bg-slate-100 hover:bg-slate-200 transition-colors">Cancelar</a>
                    <button type="submit" class="px-5 py-2.5 rounded-xl text-xs font-semibold text-white bg-pharmacore-accent hover:opacity-90 transition-opacity cursor-pointer">Registrar Venta</button>
                </div>
            </form>

        </main>
        <footer th:replace="~{fragments/layout :: footer}"></footer>
    </div>
</div>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>

<script th:inline="javascript">
    const PRODUCTOS = /*[[${productos}]]*/ [];
    const LOTES = /*[[${lotes}]]*/ [];
    const FORMULAS_VIGENTES = /*[[${formulasVigentes}]]*/ [];
    let contadorLineas = 0;

    function agregarLinea() {
        const idx = contadorLineas++;
        const div = document.createElement('div');
        div.className = 'grid grid-cols-1 sm:grid-cols-12 gap-2 items-end bg-slate-50 border border-slate-200 rounded-xl p-3';
        div.id = 'linea-' + idx;

        let opcionesProductos = '<option value="">Producto</option>';
        PRODUCTOS.forEach(p => {
            opcionesProductos += `<option value="${p.idProducto}" data-precio="${p.precioVenta}" data-requiere-formula="${p.requiereFormula}">${p.nombreComercial}${p.requiereFormula ? ' 🩺' : ''}</option>`;
        });

        div.innerHTML = `
            <div class="sm:col-span-4">
                <select class="w-full px-3 py-2 text-xs bg-white border border-slate-200 rounded-lg producto-select" onchange="actualizarLotes(${idx}); actualizarPrecio(${idx}); actualizarFormula(${idx})">${opcionesProductos}</select>
            </div>
            <div class="sm:col-span-3">
                <select class="w-full px-3 py-2 text-xs bg-white border border-slate-200 rounded-lg lote-select"><option value="">Lote</option></select>
            </div>
            <div class="sm:col-span-2">
                <input type="number" min="1" value="1" class="w-full px-3 py-2 text-xs bg-white border border-slate-200 rounded-lg cantidad-input" onchange="calcularTotales()">
            </div>
            <div class="sm:col-span-2">
                <input type="number" step="0.01" class="w-full px-3 py-2 text-xs bg-white border border-slate-200 rounded-lg precio-input" onchange="calcularTotales()">
            </div>
            <div class="sm:col-span-1 text-right">
                <button type="button" onclick="eliminarLinea(${idx})" class="text-red-500 text-xs font-semibold hover:underline">Quitar</button>
            </div>
            <div class="sm:col-span-12 formula-container hidden">
                <label class="block text-[10px] font-semibold text-amber-700 uppercase tracking-wider mb-1">🩺 Requiere fórmula médica vigente del paciente</label>
                <select class="w-full px-3 py-2 text-xs bg-amber-50 border border-amber-300 rounded-lg formula-select" onchange="calcularTotales()">
                    <option value="">Seleccione la fórmula que respalda esta venta</option>
                </select>
            </div>
            <input type="hidden" name="idProductos" class="producto-hidden">
            <input type="hidden" name="idLotes" class="lote-hidden">
            <input type="hidden" name="cantidades" class="cantidad-hidden">
            <input type="hidden" name="preciosUnitarios" class="precio-hidden">
            <input type="hidden" name="idDetallesFormula" class="formula-hidden">
        `;
        document.getElementById('lineas-venta').appendChild(div);
    }

    function actualizarLotes(idx) {
        const linea = document.getElementById('linea-' + idx);
        const idProducto = linea.querySelector('.producto-select').value;
        const loteSelect = linea.querySelector('.lote-select');
        loteSelect.innerHTML = '<option value="">Lote</option>';
        LOTES.filter(l => String(l.idProducto) === String(idProducto)).forEach(l => {
            loteSelect.innerHTML += `<option value="${l.idLote}">${l.numeroLote} (vence: ${l.fechaVencimiento})</option>`;
        });
    }

    function actualizarPrecio(idx) {
        const linea = document.getElementById('linea-' + idx);
        const select = linea.querySelector('.producto-select');
        const precio = select.selectedOptions[0] ? select.selectedOptions[0].dataset.precio : '';
        linea.querySelector('.precio-input').value = precio || '';
        calcularTotales();
    }

    // NUEVO (Día 5): si el producto seleccionado requiere fórmula, muestra el selector
    // de fórmula filtrado por el cliente elegido arriba y por ese producto.
    function actualizarFormula(idx) {
        const linea = document.getElementById('linea-' + idx);
        const select = linea.querySelector('.producto-select');
        const requiereFormula = select.selectedOptions[0] && select.selectedOptions[0].dataset.requiereFormula === 'true';
        const contenedor = linea.querySelector('.formula-container');
        const formulaSelect = linea.querySelector('.formula-select');
        const idProducto = select.value;
        const idCliente = document.querySelector('[name="idCliente"]').value;

        if (!requiereFormula) {
            contenedor.classList.add('hidden');
            formulaSelect.innerHTML = '<option value=""></option>';
            calcularTotales();
            return;
        }

        contenedor.classList.remove('hidden');
        const opciones = FORMULAS_VIGENTES.filter(f => String(f.idProducto) === String(idProducto) && String(f.idCliente) === String(idCliente));
        if (opciones.length === 0) {
            formulaSelect.innerHTML = '<option value="">⚠ El paciente seleccionado no tiene una fórmula vigente para este medicamento</option>';
        } else {
            formulaSelect.innerHTML = '<option value="">Seleccione la fórmula</option>' +
                opciones.map(f => `<option value="${f.idDetalleFormula}">${f.medico} — ${f.dosis}, ${f.frecuencia}</option>`).join('');
        }
        calcularTotales();
    }

    // Si cambia el cliente, se refrescan las fórmulas disponibles de todas las líneas ya agregadas.
    document.querySelector('[name="idCliente"]').addEventListener('change', function() {
        document.querySelectorAll('#lineas-venta > div').forEach((linea, i) => {
            const match = linea.id.match(/linea-(\d+)/);
            if (match) actualizarFormula(parseInt(match[1]));
        });
    });

    function eliminarLinea(idx) {
        const linea = document.getElementById('linea-' + idx);
        if (linea) linea.remove();
        calcularTotales();
    }

    function calcularTotales() {
        let total = 0;
        document.querySelectorAll('#lineas-venta > div').forEach(linea => {
            const cantidad = parseFloat(linea.querySelector('.cantidad-input').value) || 0;
            const precio = parseFloat(linea.querySelector('.precio-input').value) || 0;
            total += cantidad * precio;

            linea.querySelector('.producto-hidden').value = linea.querySelector('.producto-select').value;
            linea.querySelector('.lote-hidden').value = linea.querySelector('.lote-select').value;
            linea.querySelector('.cantidad-hidden').value = cantidad;
            linea.querySelector('.precio-hidden').value = precio;
            const formulaSelect = linea.querySelector('.formula-select');
            linea.querySelector('.formula-hidden').value = formulaSelect ? formulaSelect.value : '';
        });
        document.getElementById('subtotal-total').innerText = '$' + total.toLocaleString('es-CO');
    }

    document.getElementById('form-venta').addEventListener('submit', function(e) {
        calcularTotales();
        const lineas = document.querySelectorAll('#lineas-venta > div');
        if (lineas.length === 0) {
            e.preventDefault();
            alert('Agregue al menos un medicamento antes de registrar la venta.');
            return;
        }
        let hayLineaCompleta = false;
        let faltaFormula = false;
        lineas.forEach(linea => {
            const producto = linea.querySelector('.producto-select').value;
            const lote = linea.querySelector('.lote-select').value;
            const cantidad = linea.querySelector('.cantidad-input').value;
            const precio = linea.querySelector('.precio-input').value;
            if (producto && lote && cantidad && precio) hayLineaCompleta = true;

            const requiereFormula = !linea.querySelector('.formula-container').classList.contains('hidden');
            if (producto && requiereFormula && !linea.querySelector('.formula-select').value) {
                faltaFormula = true;
            }
        });
        if (!hayLineaCompleta) {
            e.preventDefault();
            alert('Complete producto, lote, cantidad y precio en al menos un medicamento. Si los selectores de Producto/Lote están vacíos, primero debe registrar medicamentos en /view/medicamentos y lotes en la tabla "lotes".');
            return;
        }
        if (faltaFormula) {
            e.preventDefault();
            alert('Hay un medicamento que requiere fórmula médica y no tiene una fórmula vigente seleccionada.');
        }
    });
    document.addEventListener('DOMContentLoaded', agregarLinea);
</script>
</body>
</html>
