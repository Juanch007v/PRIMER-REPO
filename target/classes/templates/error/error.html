<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error - PharmaCore</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100">
    <div class="card shadow border-0 p-4 text-center" style="max-width: 480px; width: 100%;">
        <h1 class="display-3 fw-bold text-danger" th:text="${status} ?: 'Error'">Error</h1>
        <h3 class="mb-3" th:text="${error} ?: 'Ocurrió un error inesperado'">Detalle de Error</h3>
        <p class="text-muted mb-4" th:text="${message} ?: 'No se pudo procesar la solicitud actual.'"></p>
        <a href="/clientes" class="btn btn-dark w-100">Volver al Inicio</a>
    </div>
</body>
</html>
