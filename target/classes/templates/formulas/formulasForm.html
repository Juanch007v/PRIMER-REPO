<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="fragments/layout :: styles"></th:block>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PharmaCore - Nueva Fórmula Médica</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" th:href="@{/img/img.png}">
    <script>
        tailwind.config = {
            theme: { extend: { colors: { pharmacore: { bg:'#F7FAF9', dark:'#004B4B', darker:'#003939', accent:'#006565', text:'#1E1E1E' } }, fontFamily: { sans: ['Poppins','sans-serif'] } } }
        }
    </script>
</head>
<body class="bg-pharmacore-bg font-sans text-pharmacore-text antialiased min-h-screen flex flex-col selection:bg-pharmacore-accent selection:text-white">

<header th:replace="~{fragments/layout :: topbar('Fórmulas Médicas')}"></header>

<div class="flex flex-1 relative min-h-[calc(100vh-4rem)]">
    <div id="overlay" onclick="toggleSidebar()" class="fixed inset-0 bg-slate-900/60 z-10 hidden md:hidden transition-all duration-300"></div>
    <aside th:replace="~{fragments/layout :: sidebar('formulas')}"></aside>

    <div class="flex-1 flex flex-col min-w-0 bg-pharmacore-bg">
        <main class="flex-1 p-4 sm:p-6 lg:p-8 max-w-4xl mx-auto w-full">

            <div class="mb-6 flex items-center justify-between">
                <div>
                    <h1 class="text-xl sm:text-2xl font-bold text-pharmacore-dark uppercase tracking-wide">NUEVA FÓRMULA MÉDICA</h1>
                    <p class="text-xs sm:text-sm text-slate-500">Registre la prescripción del médico y los medicamentos formulados.</p>
                </div>
                <a th:href="@{/view/formulas}" class="bg-slate-200 text-slate-700 px-4 py-2 rounded-xl text-xs font-semibold hover:bg-slate-300 transition-colors">← Volver</a>
            </div>

            <div th:if="${error}" class="bg-red-50 text-red-700 border border-red-200 p-3 mb-4 rounded-xl text-sm" th:text="${error}"></div>

            <form th:action="@{/view/formulas/save}" th:object="${formulaMedica}" method="post" class="space-y-6">

                <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 sm:p-8">
                    <h2 class="text-xs font-bold text-pharmacore-accent uppercase tracking-wider mb-4">Datos de la Fórmula</h2>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                        <div>
                            <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-2">Paciente</label>
                            <select th:field="*{idCliente}" class="w-full px-4 py-2.5 text-xs sm:text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-pharmacore-accent transition-all" required>
                                <option value="">Seleccione un paciente</option>
                                <option th:each="c : ${clientes}" th:value="${c.id_cliente}" th:text="${c.nombreCompleto}"></option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-2">Fecha de Expedición</label>
                            <input type="date" th:field="*{fechaExpedicion}" class="w-full px-4 py-2.5 text-xs sm:text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-pharmacore-accent transition-all">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-2">Nombre del Médico</label>
                            <input type="text" th:field="*{nombreMedico}" placeholder="Ej: Dr. Juan Pérez" class="w-full px-4 py-2.5 text-xs sm:text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-pharmacore-accent transition-all" required>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-2">Tarjeta Profesional</label>
                            <input type="text" th:field="*{tarjetaProfesional}" placeholder="Ej: RM-12345" class="w-full px-4 py-2.5 text-xs sm:text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-pharmacore-accent transition-all" required>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-2">Entidad de Salud</label>
                            <input type="text" th:field="*{entidadSalud}" placeholder="Ej: EPS Sura" class="w-full px-4 py-2.5 text-xs sm:text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-pharmacore-accent transition-all">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-2">Vigencia (días)</label>
                            <input type="number" th:field="*{vigenciaDias}" class="w-full px-4 py-2.5 text-xs sm:text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-pharmacore-accent transition-all">
                        </div>
                    </div>
                    <div class="mt-6">
                        <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-2">Observaciones</label>
                        <textarea th:field="*{observaciones}" rows="3" placeholder="Indicaciones adicionales del médico..." class="w-full px-4 py-2.5 text-xs sm:text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-pharmacore-accent transition-all"></textarea>
                    </div>
                </div>

                <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 sm:p-8">
                    <div class="flex items-center justify-between mb-4">
                        <h2 class="text-xs font-bold text-pharmacore-accent uppercase tracking-wider">Medicamentos Formulados</h2>
                        <button type="button" onclick="agregarLinea()" class="bg-pharmacore-accent/10 text-pharmacore-accent px-3 py-1.5 rounded-lg text-xs font-semibold hover:bg-pharmacore-accent/20 transition-colors">+ Agregar medicamento</button>
                    </div>
                    <div id="lineas-formula" class="space-y-3"></div>
                </div>

                <div class="flex items-center justify-end gap-3">
                    <a th:href="@{/view/formulas}" class="px-5 py-2.5 rounded-xl text-xs font-semibold text-slate-600 bg-slate-100 hover:bg-slate-200 transition-colors">Cancelar</a>
                    <button type="submit" class="px-5 py-2.5 rounded-xl text-xs font-semibold text-white bg-pharmacore-accent hover:opacity-90 transition-opacity cursor-pointer">Guardar Fórmula</button>
                </div>
            </form>

        </main>
        <footer th:replace="~{fragments/layout :: footer}"></footer>
    </div>
</div>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>

<script th:inline="javascript">
    const PRODUCTOS = /*[[${productos}]]*/ [];
    let contador = 0;

    function agregarLinea() {
        const idx = contador++;
        const div = document.createElement('div');
        div.className = 'grid grid-cols-1 sm:grid-cols-12 gap-2 items-end bg-slate-50 border border-slate-200 rounded-xl p-3';
        div.id = 'linea-formula-' + idx;

        let opciones = '<option value="">Medicamento</option>';
        PRODUCTOS.forEach(p => {
            opciones += `<option value="${p.idProducto}">${p.nombreComercial}</option>`;
        });

        div.innerHTML = `
            <div class="sm:col-span-3">
                <select name="idProductos" class="w-full px-3 py-2 text-xs bg-white border border-slate-200 rounded-lg">${opciones}</select>
            </div>
            <div class="sm:col-span-3">
                <input type="text" name="dosisList" placeholder="Dosis (ej: 1 tableta)" class="w-full px-3 py-2 text-xs bg-white border border-slate-200 rounded-lg">
            </div>
            <div class="sm:col-span-3">
                <input type="text" name="frecuenciaList" placeholder="Frecuencia (ej: cada 8h)" class="w-full px-3 py-2 text-xs bg-white border border-slate-200 rounded-lg">
            </div>
            <div class="sm:col-span-2">
                <input type="text" name="duracionTratamientoList" placeholder="Duración (ej: 7 días)" class="w-full px-3 py-2 text-xs bg-white border border-slate-200 rounded-lg">
            </div>
            <div class="sm:col-span-1 text-right">
                <button type="button" onclick="document.getElementById('linea-formula-${idx}').remove()" class="text-red-500 text-xs font-semibold hover:underline">Quitar</button>
            </div>
        `;
        document.getElementById('lineas-formula').appendChild(div);
    }

    document.addEventListener('DOMContentLoaded', agregarLinea);
</script>
</body>
</html>
