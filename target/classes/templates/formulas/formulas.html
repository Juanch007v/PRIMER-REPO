<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="fragments/layout :: styles"></th:block>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PharmaCore - Fórmulas Médicas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" th:href="@{/img/img.png}">
    <script>
        tailwind.config = {
            theme: { extend: { colors: { pharmacore: { bg:'#F7FAF9', dark:'#004B4B', darker:'#003939', accent:'#006565', text:'#1E1E1E' } }, fontFamily: { sans: ['Poppins','sans-serif'] } } }
        }
    </script>
</head>
<body class="bg-pharmacore-bg font-sans text-pharmacore-text antialiased min-h-screen flex flex-col selection:bg-pharmacore-accent selection:text-white">

<header th:replace="~{fragments/layout :: topbar('Fórmulas Médicas')}"></header>

<div class="flex flex-1 relative min-h-[calc(100vh-4rem)]">
    <div id="overlay" onclick="toggleSidebar()" class="fixed inset-0 bg-slate-900/60 z-10 hidden md:hidden transition-all duration-300"></div>
    <aside th:replace="~{fragments/layout :: sidebar('formulas')}"></aside>

    <div class="flex-1 flex flex-col min-w-0 bg-pharmacore-bg">
        <main class="flex-1 p-4 sm:p-6 lg:p-8">

            <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 mb-6">
                <div>
                    <h1 class="text-xl sm:text-2xl font-bold text-pharmacore-dark uppercase tracking-wide">FÓRMULAS MÉDICAS</h1>
                    <p class="text-xs sm:text-sm text-slate-500">Gestione las fórmulas de los pacientes para medicamentos que requieren prescripción.</p>
                </div>
                <a th:href="@{/view/formulas/form}" class="bg-pharmacore-accent text-white px-4 py-2 rounded-xl text-xs font-semibold hover:opacity-90 transition-opacity">+ Nueva Fórmula</a>
            </div>

            <div th:if="${mensaje}" class="bg-emerald-50 text-emerald-700 border border-emerald-200 p-3 mb-4 rounded-xl text-sm" th:text="${mensaje}"></div>
            <div th:if="${error}" class="bg-red-50 text-red-700 border border-red-200 p-3 mb-4 rounded-xl text-sm" th:text="${error}"></div>

            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                <div class="p-4 sm:p-6 border-b border-slate-100">
                    <span class="text-xs sm:text-sm font-medium text-slate-600">
                        Total registros: <span class="font-bold text-pharmacore-dark" th:text="${#lists.size(formulas)}">0</span>
                    </span>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-sm text-left">
                        <thead class="bg-pharmacore-dark text-white text-xs uppercase tracking-wider">
                        <tr>
                            <th class="p-4">ID</th>
                            <th class="p-4">Paciente</th>
                            <th class="p-4">Médico</th>
                            <th class="p-4">Entidad Salud</th>
                            <th class="p-4">Expedición</th>
                            <th class="p-4">Vigencia (días)</th>
                            <th class="p-4 text-center">Acciones</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:if="${#lists.isEmpty(formulas)}">
                            <td colspan="7" class="p-6 text-center text-slate-400 text-xs">No hay fórmulas médicas registradas todavía.</td>
                        </tr>
                        <tr th:each="f : ${formulas}" class="border-b border-slate-100 hover:bg-slate-50 transition-colors">
                            <td class="p-4 font-mono text-xs text-slate-600" th:text="${'#' + f.idFormula}"></td>
                            <td class="p-4 text-xs" th:text="${nombresClientes.get(f.idCliente) ?: ('Cliente #' + f.idCliente)}"></td>
                            <td class="p-4 text-xs text-slate-700" th:text="${f.nombreMedico}"></td>
                            <td class="p-4 text-xs text-slate-600" th:text="${f.entidadSalud}"></td>
                            <td class="p-4 text-xs text-slate-600" th:text="${#temporals.format(f.fechaExpedicion, 'dd/MM/yyyy')}"></td>
                            <td class="p-4 text-xs text-slate-600" th:text="${f.vigenciaDias}"></td>
                            <td class="p-4 text-center whitespace-nowrap">
                                <a th:href="@{/view/formulas/detalle/{id}(id=${f.idFormula})}" class="text-pharmacore-accent font-semibold mr-3 hover:underline">Ver</a>
                                <form th:action="@{/view/formulas/delete/{id}(id=${f.idFormula})}" method="post" class="inline">
                                    <button type="submit" class="text-red-600 font-semibold hover:underline" onclick="return confirm('¿Eliminar esta fórmula médica?');">Eliminar</button>
                                </form>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </main>
        <footer th:replace="~{fragments/layout :: footer}"></footer>
    </div>
</div>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
