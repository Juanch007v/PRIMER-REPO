<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="fragments/layout :: styles"></th:block>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PharmaCore - Detalle de Fórmula</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" th:href="@{/img/img.png}">
    <script>
        tailwind.config = {
            theme: { extend: { colors: { pharmacore: { bg:'#F7FAF9', dark:'#004B4B', darker:'#003939', accent:'#006565', text:'#1E1E1E' } }, fontFamily: { sans: ['Poppins','sans-serif'] } } }
        }
    </script>
</head>
<body class="bg-pharmacore-bg font-sans text-pharmacore-text antialiased min-h-screen flex flex-col selection:bg-pharmacore-accent selection:text-white">

<header th:replace="~{fragments/layout :: topbar('Detalle de Fórmula Médica')}"></header>

<div class="flex flex-1 relative min-h-[calc(100vh-4rem)]">
    <div id="overlay" onclick="toggleSidebar()" class="fixed inset-0 bg-slate-900/60 z-10 hidden md:hidden transition-all duration-300"></div>
    <aside th:replace="~{fragments/layout :: sidebar('formulas')}"></aside>

    <div class="flex-1 flex flex-col min-w-0 bg-pharmacore-bg">
        <main class="flex-1 p-4 sm:p-6 lg:p-8 max-w-4xl mx-auto w-full">

            <div class="mb-6 flex items-center justify-between">
                <div>
                    <h1 class="text-xl sm:text-2xl font-bold text-pharmacore-dark uppercase tracking-wide" th:text="'FÓRMULA #' + ${formula.idFormula}"></h1>
                    <p class="text-xs sm:text-sm text-slate-500" th:text="${'Paciente: ' + (nombresClientes.get(formula.idCliente) ?: ('Cliente #' + formula.idCliente)) + ' — Médico: ' + formula.nombreMedico}"></p>
                </div>
                <a th:href="@{/view/formulas}" class="bg-slate-200 text-slate-700 px-4 py-2 rounded-xl text-xs font-semibold hover:bg-slate-300 transition-colors">← Volver</a>
            </div>

            <div th:if="${mensaje}" class="bg-emerald-50 text-emerald-700 border border-emerald-200 p-3 mb-4 rounded-xl text-sm" th:text="${mensaje}"></div>

            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 mb-6 grid grid-cols-2 sm:grid-cols-4 gap-4 text-xs">
                <div><span class="text-slate-400 block">Entidad de Salud</span><span class="font-semibold" th:text="${formula.entidadSalud ?: '-'}"></span></div>
                <div><span class="text-slate-400 block">Tarjeta Profesional</span><span class="font-semibold" th:text="${formula.tarjetaProfesional}"></span></div>
                <div><span class="text-slate-400 block">Fecha Expedición</span><span class="font-semibold" th:text="${#temporals.format(formula.fechaExpedicion, 'dd/MM/yyyy')}"></span></div>
                <div><span class="text-slate-400 block">Vigencia</span><span class="font-semibold" th:text="${formula.vigenciaDias + ' días'}"></span></div>
                <div class="col-span-2 sm:col-span-4" th:if="${formula.observaciones}">
                    <span class="text-slate-400 block">Observaciones</span><span class="font-medium" th:text="${formula.observaciones}"></span>
                </div>
            </div>

            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden mb-6">
                <table class="w-full text-sm text-left">
                    <thead class="bg-pharmacore-dark text-white text-xs uppercase tracking-wider">
                    <tr>
                        <th class="p-4">Medicamento</th>
                        <th class="p-4">Dosis</th>
                        <th class="p-4">Frecuencia</th>
                        <th class="p-4">Duración</th>
                        <th class="p-4 text-center">Acciones</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:if="${#lists.isEmpty(detalles)}">
                        <td colspan="5" class="p-6 text-center text-slate-400 text-xs">Esta fórmula aún no tiene medicamentos.</td>
                    </tr>
                    <tr th:each="d : ${detalles}" class="border-b border-slate-100">
                        <td class="p-4 text-xs" th:text="${nombresProductos.get(d.idProducto) ?: ('Producto #' + d.idProducto)}"></td>
                        <td class="p-4 text-xs" th:text="${d.dosis}"></td>
                        <td class="p-4 text-xs" th:text="${d.frecuencia}"></td>
                        <td class="p-4 text-xs" th:text="${d.duracionTratamiento}"></td>
                        <td class="p-4 text-center">
                            <form th:action="@{/view/formulas/detalle-linea/delete/{id}(id=${d.idDetalleFormula})}" method="post" class="inline">
                                <button type="submit" class="text-red-600 font-semibold hover:underline text-xs" onclick="return confirm('¿Eliminar este medicamento de la fórmula?');">Eliminar</button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>

            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
                <h2 class="text-xs font-bold text-pharmacore-accent uppercase tracking-wider mb-4">Agregar Medicamento</h2>
                <form th:action="@{/view/formulas/detalle/{id}/agregar(id=${formula.idFormula})}" method="post" class="grid grid-cols-1 sm:grid-cols-12 gap-3 items-end">
                    <div class="sm:col-span-3">
                        <select name="idProducto" class="w-full px-3 py-2 text-xs bg-slate-50 border border-slate-200 rounded-lg" required>
                            <option value="">Medicamento</option>
                            <option th:each="p : ${productos}" th:value="${p.idProducto}" th:text="${p.nombreComercial}"></option>
                        </select>
                    </div>
                    <div class="sm:col-span-3">
                        <input type="text" name="dosis" placeholder="Dosis" class="w-full px-3 py-2 text-xs bg-slate-50 border border-slate-200 rounded-lg" required>
                    </div>
                    <div class="sm:col-span-3">
                        <input type="text" name="frecuencia" placeholder="Frecuencia" class="w-full px-3 py-2 text-xs bg-slate-50 border border-slate-200 rounded-lg" required>
                    </div>
                    <div class="sm:col-span-2">
                        <input type="text" name="duracionTratamiento" placeholder="Duración" class="w-full px-3 py-2 text-xs bg-slate-50 border border-slate-200 rounded-lg" required>
                    </div>
                    <div class="sm:col-span-1">
                        <button type="submit" class="w-full px-3 py-2 rounded-lg text-xs font-semibold text-white bg-pharmacore-accent hover:opacity-90 transition-opacity cursor-pointer">+</button>
                    </div>
                </form>
            </div>

        </main>
        <footer th:replace="~{fragments/layout :: footer}"></footer>
    </div>
</div>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
