<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="fragments/layout :: styles"></th:block>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PharmaCore - Categoría</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" th:href="@{/img/img.png}">
    <script>
        tailwind.config = {
            theme: { extend: { colors: { pharmacore: { bg:'#F7FAF9', dark:'#004B4B', darker:'#003939', accent:'#006565', text:'#1E1E1E' } }, fontFamily: { sans: ['Poppins','sans-serif'] } } }
        }
    </script>
</head>
<body class="bg-pharmacore-bg font-sans text-pharmacore-text antialiased min-h-screen flex flex-col selection:bg-pharmacore-accent selection:text-white">

<header th:replace="~{fragments/layout :: topbar('Categorías')}"></header>

<div class="flex flex-1 relative min-h-[calc(100vh-4rem)]">
    <div id="overlay" onclick="toggleSidebar()" class="fixed inset-0 bg-slate-900/60 z-10 hidden md:hidden transition-all duration-300"></div>
    <aside th:replace="~{fragments/layout :: sidebar('categorias')}"></aside>

    <div class="flex-1 flex flex-col min-w-0 bg-pharmacore-bg">
        <main class="flex-1 p-4 sm:p-6 lg:p-8 max-w-xl mx-auto w-full">

            <div class="mb-6 flex items-center justify-between">
                <h1 class="text-xl sm:text-2xl font-bold text-pharmacore-dark uppercase tracking-wide"
                    th:text="${categoria.id_categoria == null ? 'NUEVA CATEGORÍA' : 'EDITAR CATEGORÍA'}">Categoría</h1>
                <a th:href="@{/view/categorias}" class="bg-slate-200 text-slate-700 px-4 py-2 rounded-xl text-xs font-semibold hover:bg-slate-300 transition-colors">← Volver</a>
            </div>

            <div th:if="${error}" class="bg-red-50 text-red-700 border border-red-200 p-3 mb-4 rounded-xl text-sm" th:text="${error}"></div>

            <form th:action="@{/view/categorias/save}" th:object="${categoria}" method="post" class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 sm:p-8 space-y-5">

                <input type="hidden" th:field="*{id_categoria}" />

                <div>
                    <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-2">Nombre</label>
                    <input type="text" th:field="*{nombre}" placeholder="Ej: Analgésicos"
                           class="w-full px-4 py-2.5 text-xs sm:text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-pharmacore-accent transition-all" required>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-2">Descripción</label>
                    <textarea th:field="*{descripcion}" rows="3" placeholder="Breve descripción de la categoría..."
                              class="w-full px-4 py-2.5 text-xs sm:text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-pharmacore-accent transition-all" required></textarea>
                </div>

                <div class="flex items-center justify-end gap-3 pt-2">
                    <a th:href="@{/view/categorias}" class="px-5 py-2.5 rounded-xl text-xs font-semibold text-slate-600 bg-slate-100 hover:bg-slate-200 transition-colors">Cancelar</a>
                    <button type="submit" class="px-5 py-2.5 rounded-xl text-xs font-semibold text-white bg-pharmacore-accent hover:opacity-90 transition-opacity cursor-pointer">Guardar</button>
                </div>
            </form>

        </main>
        <footer th:replace="~{fragments/layout :: footer}"></footer>
    </div>
</div>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
