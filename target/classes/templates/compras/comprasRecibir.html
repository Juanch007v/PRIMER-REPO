<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="fragments/layout :: styles"></th:block>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PharmaCore - Recibir Compra</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" th:href="@{/img/img.png}">
    <script>
        tailwind.config = {
            theme: { extend: { colors: { pharmacore: { bg:'#F7FAF9', dark:'#004B4B', darker:'#003939', accent:'#006565', text:'#1E1E1E' } }, fontFamily: { sans: ['Poppins','sans-serif'] } } }
        }
    </script>
</head>
<body class="bg-pharmacore-bg font-sans text-pharmacore-text antialiased min-h-screen flex flex-col selection:bg-pharmacore-accent selection:text-white">

<header th:replace="~{fragments/layout :: topbar('Recibir Compra')}"></header>

<div class="flex flex-1 relative min-h-[calc(100vh-4rem)]">
    <div id="overlay" onclick="toggleSidebar()" class="fixed inset-0 bg-slate-900/60 z-10 hidden md:hidden transition-all duration-300"></div>
    <aside th:replace="~{fragments/layout :: sidebar('ordenes-compra')}"></aside>

    <div class="flex-1 flex flex-col min-w-0 bg-pharmacore-bg">
        <main class="flex-1 p-4 sm:p-6 lg:p-8 max-w-4xl mx-auto w-full">

            <div class="mb-6 flex items-center justify-between">
                <div>
                    <h1 class="text-xl sm:text-2xl font-bold text-pharmacore-dark uppercase tracking-wide" th:text="'RECIBIR COMPRA #' + ${compra.idCompra}"></h1>
                    <p class="text-xs sm:text-sm text-slate-500">Indique el número de lote y la fecha de vencimiento con la que llegó cada producto. Esto creará un lote nuevo y sumará el inventario.</p>
                </div>
                <a th:href="@{/view/ordenes-compra/detalle/{id}(id=${compra.idCompra})}" class="bg-slate-200 text-slate-700 px-4 py-2 rounded-xl text-xs font-semibold hover:bg-slate-300 transition-colors">← Volver</a>
            </div>

            <div th:if="${error}" class="bg-red-50 text-red-700 border border-red-200 p-3 mb-4 rounded-xl text-sm" th:text="${error}"></div>

            <form th:action="@{/view/ordenes-compra/recibir/{id}/confirmar(id=${compra.idCompra})}" method="post" class="space-y-6">

                <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                    <table class="w-full text-sm text-left">
                        <thead class="bg-pharmacore-dark text-white text-xs uppercase tracking-wider">
                        <tr>
                            <th class="p-4">Producto</th>
                            <th class="p-4">Cantidad</th>
                            <th class="p-4">Número de Lote</th>
                            <th class="p-4">Fecha de Vencimiento</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="d, iter : ${detalles}" class="border-b border-slate-100">
                            <td class="p-4 text-xs font-semibold">
                                <span th:each="p : ${productos}" th:if="${p.idProducto == d.idProducto}" th:text="${p.nombreComercial}"></span>
                                <input type="hidden" name="idDetalle" th:value="${d.idDetalleCompra}"/>
                            </td>
                            <td class="p-4 text-xs" th:text="${d.cantidad}"></td>
                            <td class="p-4">
                                <input type="text" name="numeroLote" placeholder="Ej: L-2026-01" class="w-full px-3 py-2 text-xs bg-slate-50 border border-slate-200 rounded-lg" required>
                            </td>
                            <td class="p-4">
                                <input type="date" name="fechaVencimiento" class="w-full px-3 py-2 text-xs bg-slate-50 border border-slate-200 rounded-lg" required>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>

                <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 sm:p-8">
                    <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-2">Usuario que recibe</label>
                    <select name="idUsuario" class="w-full px-4 py-2.5 text-xs sm:text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-pharmacore-accent transition-all" required>
                        <option value="">Seleccione un usuario</option>
                        <option th:each="u : ${usuarios}" th:value="${u.idUsuario}" th:text="${u.username}"></option>
                    </select>
                </div>

                <div class="flex items-center justify-end gap-3">
                    <a th:href="@{/view/ordenes-compra/detalle/{id}(id=${compra.idCompra})}" class="px-5 py-2.5 rounded-xl text-xs font-semibold text-slate-600 bg-slate-100 hover:bg-slate-200 transition-colors">Cancelar</a>
                    <button type="submit" class="px-5 py-2.5 rounded-xl text-xs font-semibold text-white bg-pharmacore-accent hover:opacity-90 transition-opacity cursor-pointer">Confirmar Recepción</button>
                </div>
            </form>

        </main>
        <footer th:replace="~{fragments/layout :: footer}"></footer>
    </div>
</div>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
