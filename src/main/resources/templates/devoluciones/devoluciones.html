<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="fragments/layout :: styles"></th:block>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PharmaCore - Devoluciones</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" th:href="@{/img/img.png}">
    <script>
        tailwind.config = {
            theme: { extend: { colors: { pharmacore: { bg:'#F7FAF9', dark:'#004B4B', darker:'#003939', accent:'#006565', text:'#1E1E1E' } }, fontFamily: { sans: ['Poppins','sans-serif'] } } }
        }
    </script>
</head>
<body class="bg-pharmacore-bg font-sans text-pharmacore-text antialiased min-h-screen flex flex-col selection:bg-pharmacore-accent selection:text-white">

<header th:replace="~{fragments/layout :: topbar('Devoluciones')}"></header>

<div class="flex flex-1 relative min-h-[calc(100vh-4rem)]">
    <div id="overlay" onclick="toggleSidebar()" class="fixed inset-0 bg-slate-900/60 z-10 hidden md:hidden transition-all duration-300"></div>
    <aside th:replace="~{fragments/layout :: sidebar('devoluciones')}"></aside>

    <div class="flex-1 flex flex-col min-w-0 bg-pharmacore-bg">
        <main class="flex-1 p-4 sm:p-6 lg:p-8">

            <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 mb-6">
                <div>
                    <h1 class="text-xl sm:text-2xl font-bold text-pharmacore-dark uppercase tracking-wide">DEVOLUCIONES</h1>
                    <p class="text-xs sm:text-sm text-slate-500">Devoluciones de clientes y a proveedores, con su efecto en el inventario.</p>
                </div>
                <a th:href="@{/view/devoluciones/form}" class="bg-pharmacore-accent text-white px-4 py-2 rounded-xl text-xs font-semibold hover:opacity-90 transition-opacity">+ Nueva Devolución</a>
            </div>

            <div th:if="${mensaje}" class="bg-emerald-50 text-emerald-700 border border-emerald-200 p-3 mb-4 rounded-xl text-sm" th:text="${mensaje}"></div>
            <div th:if="${error}" class="bg-red-50 text-red-700 border border-red-200 p-3 mb-4 rounded-xl text-sm" th:text="${error}"></div>

            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                <div class="p-4 sm:p-6 border-b border-slate-100">
                    <span class="text-xs sm:text-sm font-medium text-slate-600">
                        Total registros: <span class="font-bold text-pharmacore-dark" th:text="${#lists.size(devoluciones)}">0</span>
                    </span>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-sm text-left">
                        <thead class="bg-pharmacore-dark text-white text-xs uppercase tracking-wider">
                        <tr>
                            <th class="p-4">Fecha</th>
                            <th class="p-4">Tipo</th>
                            <th class="p-4">Producto</th>
                            <th class="p-4 text-center">Cantidad</th>
                            <th class="p-4">Motivo</th>
                            <th class="p-4">Estado del producto</th>
                            <th class="p-4">Origen</th>
                            <th class="p-4">Registrada por</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:if="${#lists.isEmpty(devoluciones)}">
                            <td colspan="8" class="p-6 text-center text-slate-400 text-xs">No hay devoluciones registradas todavía.</td>
                        </tr>
                        <tr th:each="d : ${devoluciones}" class="border-b border-slate-100 hover:bg-slate-50 transition-colors">
                            <td class="p-4 text-xs text-slate-600" th:text="${#temporals.format(d.fechaDevolucion, 'dd/MM/yyyy HH:mm')}"></td>
                            <td class="p-4">
                                <span class="px-2 py-1 rounded-full text-[10px] font-bold"
                                      th:classappend="${d.tipoDevolucion == 'CLIENTE'} ? 'bg-blue-50 text-blue-700' : 'bg-purple-50 text-purple-700'"
                                      th:text="${d.tipoDevolucion}"></span>
                            </td>
                            <td class="p-4 text-xs" th:text="${nombresProductos.get(d.idProducto) ?: ('Producto #' + d.idProducto)}"></td>
                            <td class="p-4 text-xs text-center font-semibold" th:text="${d.cantidad}"></td>
                            <td class="p-4 text-xs text-slate-600" th:text="${#strings.replace(d.motivo, '_', ' ')}"></td>
                            <td class="p-4">
                                <span class="px-2 py-1 rounded-full text-[10px] font-bold"
                                      th:classappend="${d.estadoProducto == 'APTO_PARA_REINGRESO'} ? 'bg-emerald-50 text-emerald-700' : (${d.estadoProducto == 'DESECHADO'} ? 'bg-red-50 text-red-700' : 'bg-amber-50 text-amber-700')"
                                      th:text="${#strings.replace(d.estadoProducto, '_', ' ')}"></span>
                            </td>
                            <td class="p-4 text-xs text-slate-600">
                                <span th:if="${d.idVenta != null}" th:text="${'Venta ' + (numerosFactura.get(d.idVenta) ?: ('#' + d.idVenta))}"></span>
                                <span th:if="${d.idCompra != null}" th:text="${'Compra ' + (facturasProveedor.get(d.idCompra) ?: ('#' + d.idCompra))}"></span>
                                <span th:if="${d.idVenta == null and d.idCompra == null}" class="text-slate-400">—</span>
                            </td>
                            <td class="p-4 text-xs text-slate-600" th:text="${nombresUsuarios.get(d.idUsuarioRegente) ?: ('Usuario #' + d.idUsuarioRegente)}"></td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </main>
        <footer th:replace="~{fragments/layout :: footer}"></footer>
    </div>
</div>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
