<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error Inesperado | PharmaCore</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100">
    <div class="container text-center">
        <div class="card shadow-lg border-0 mx-auto p-4 p-md-5" style="max-width: 500px; border-radius: 16px;">
            <div class="mb-3 text-warning">
                <i class="bi bi-exclamation-triangle-fill display-1"></i>
            </div>
            <h1 class="display-4 fw-bold text-dark mb-1" th:text="${status} ?: 'Error'">Error</h1>
            <h2 class="h5 fw-bold text-secondary mb-3" th:text="${error} ?: 'Ocurrió un inconveniente'">Detalle de Error</h2>
            <p class="text-muted mb-4 small" th:text="${message} ?: 'No fue posible procesar la solicitud en este momento.'"></p>
            <div class="d-flex gap-2 justify-content-center">
                <a href="/clientes" class="btn btn-dark px-4 py-2 w-100">
                    <i class="bi bi-house-door-fill me-1"></i> Volver al Inicio
                </a>
            </div>
        </div>
    </div>
</body>
</html>
