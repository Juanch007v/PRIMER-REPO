<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="fragments/layout :: styles"></th:block>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PharmaCore - Registro de Proveedores</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" th:href="@{/img/img.png}">
    <script>
        tailwind.config = {
            theme: { extend: { colors: { pharmacore: { bg:'#F7FAF9', dark:'#004B4B', darker:'#003939', accent:'#006565', text:'#1E1E1E' } }, fontFamily: { sans: ['Poppins','sans-serif'] } } }
        }
    </script>
</head>
<body class="bg-pharmacore-bg font-sans text-pharmacore-text antialiased min-h-screen flex flex-col selection:bg-pharmacore-accent selection:text-white">

<header th:replace="~{fragments/layout :: topbar('Proveedores')}"></header>

<div class="flex flex-1 relative min-h-[calc(100vh-4rem)]">
    <div id="overlay" onclick="toggleSidebar()" class="fixed inset-0 bg-slate-900/60 z-10 hidden md:hidden transition-all duration-300"></div>
    <aside th:replace="~{fragments/layout :: sidebar('proveedores')}"></aside>

    <div class="flex-1 flex flex-col min-w-0 bg-pharmacore-bg">
        <main class="flex-1 p-4 sm:p-6 lg:p-8">

            <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 mb-6">
                <div>
                    <h1 class="text-xl sm:text-2xl font-bold text-pharmacore-dark uppercase tracking-wide">REGISTRO DE PROVEEDORES</h1>
                    <p class="text-xs sm:text-sm text-slate-500">Administre la información de los proveedores y tipos de productos centralizados.</p>
                </div>
                <div>
                    <a th:href="@{/view/proveedores/form}" class="bg-pharmacore-accent text-white px-4 py-2 rounded-xl text-xs font-semibold hover:opacity-90 transition-opacity">
                        + Nuevo Proveedor
                    </a>
                </div>
            </div>

            <div th:if="${mensaje}" class="bg-emerald-50 text-emerald-700 border border-emerald-200 p-3 mb-4 rounded-xl text-sm" th:text="${mensaje}"></div>
            <div th:if="${error}" class="bg-red-50 text-red-700 border border-red-200 p-3 mb-4 rounded-xl text-sm" th:text="${error}"></div>

            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">

                <div class="p-4 sm:p-6 border-b border-slate-100 flex flex-col sm:flex-row items-center justify-between gap-4">
                    <div class="relative w-full sm:w-96">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-slate-400">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                        </span>
                        <input type="text" id="buscador" onkeyup="filtrarTabla()" placeholder="Buscar proveedor por razón social, NIT..." class="w-full pl-9 pr-4 py-2 text-xs sm:text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-pharmacore-accent transition-all">
                    </div>
                    <div class="text-xs sm:text-sm font-medium text-slate-600">
                        Total registros: <span class="font-bold text-pharmacore-dark" th:text="${#lists.size(proveedores)}">0</span>
                    </div>
                </div>

                <div class="overflow-x-auto">
                    <table class="w-full text-sm text-left" id="tabla-proveedores">
                        <thead class="bg-pharmacore-dark text-white text-xs uppercase tracking-wider">
                        <tr>
                            <th class="p-4">NIT</th>
                            <th class="p-4">Razón Social</th>
                            <th class="p-4">Contacto</th>
                            <th class="p-4">Teléfono</th>
                            <th class="p-4">Tipo Productos</th>
                            <th class="p-4">Estado</th>
                            <th class="p-4 text-center">Acciones</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:if="${#lists.isEmpty(proveedores)}">
                            <td colspan="7" class="p-6 text-center text-slate-400 text-xs">No hay proveedores registrados todavía.</td>
                        </tr>
                        <tr th:each="p : ${proveedores}" class="border-b border-slate-100 hover:bg-slate-50 transition-colors">
                            <td class="p-4 text-xs font-mono text-slate-600" th:text="${p.nit}"></td>
                            <td class="p-4 text-xs font-semibold text-slate-700" th:text="${p.razon_social}"></td>
                            <td class="p-4 text-xs">
                                <div class="text-slate-700" th:text="${p.nombre_contacto}"></div>
                                <div class="text-[10px] text-slate-400" th:text="${p.correo}"></div>
                            </td>
                            <td class="p-4 text-xs text-slate-600" th:text="${p.telefono}"></td>
                            <td class="p-4 text-xs text-slate-600" th:text="${p.tipo_productos}"></td>
                            <td class="p-4 text-xs">
                                <span th:text="${p.estado}"
                                      th:classappend="${p.estado.name() == 'ACTIVO'} ? 'bg-emerald-100 text-emerald-700' : 'bg-red-100 text-red-700'"
                                      class="inline-block px-2 py-0.5 rounded-full text-[10px] font-semibold"></span>
                            </td>
                            <td class="p-4 text-center whitespace-nowrap">
                                <a th:href="@{/view/proveedores/edit/{id}(id=${p.id_proveedor})}" class="text-pharmacore-accent font-semibold mr-3 hover:underline">Editar</a>
                                <form th:action="@{/view/proveedores/delete/{id}(id=${p.id_proveedor})}" method="post" class="inline">
                                    <button type="submit" class="text-red-600 font-semibold hover:underline" onclick="return confirm('¿Eliminar este proveedor?');">Eliminar</button>
                                </form>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </main>
        <footer th:replace="~{fragments/layout :: footer}"></footer>
    </div>
</div>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>

<script>
    function filtrarTabla() {
        const filtro = document.getElementById('buscador').value.toLowerCase();
        document.querySelectorAll('#tabla-proveedores tbody tr').forEach(fila => {
            fila.style.display = fila.textContent.toLowerCase().includes(filtro) ? '' : 'none';
        });
    }
</script>
</body>
</html>
