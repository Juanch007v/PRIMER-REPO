<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PharmaCore - Registrar Medicamento</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="icon" type="image/png" th:href="@{/img/img.png}">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        pharmacore: {
                            bg: '#F7FAF9',
                            dark: '#004B4B',
                            darker: '#003939',
                            accent: '#006565',
                            text: '#1E1E1E'
                        }
                    },
                    fontFamily: {
                        sans: ['Poppins', 'sans-serif'],
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-pharmacore-bg font-sans text-pharmacore-text antialiased min-h-screen flex flex-col selection:bg-pharmacore-accent selection:text-white">

<header th:replace="~{fragments/layout :: topbar('Productos')}"></header>

<div class="flex flex-1 relative min-h-[calc(100vh-4rem)]">

    <div id="overlay" onclick="toggleSidebar()" class="fixed inset-0 bg-slate-900/60 z-10 hidden md:hidden transition-all duration-300"></div>

    <aside th:replace="~{fragments/layout :: sidebar('medicamentos')}"></aside>

    <div class="flex-1 flex flex-col min-w-0 bg-pharmacore-bg">
        <main class="flex-1 p-4 sm:p-6 lg:p-8 max-w-4xl mx-auto w-full">

            <div class="mb-6 flex items-center justify-between">
                <div>
                    <h1 class="text-xl sm:text-2xl font-bold text-pharmacore-dark uppercase tracking-wide"
                        th:text="${producto.idProducto == null ? 'REGISTRAR NUEVO MEDICAMENTO' : 'EDITAR MEDICAMENTO'}"></h1>
                    <p class="text-xs sm:text-sm text-slate-500">Complete los datos requeridos para dar de alta un medicamento en el catálogo.</p>
                </div>
                <div>
                    <a th:href="@{/view/medicamentos}" class="bg-slate-200 text-slate-700 px-4 py-2 rounded-xl text-xs font-semibold hover:bg-slate-300 transition-colors">
                        ← Volver
                    </a>
                </div>
            </div>

            <div th:if="${error}" class="bg-red-50 text-red-700 border border-red-200 p-3 mb-4 rounded-xl text-sm" th:text="${error}"></div>

            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden p-6 sm:p-8">
                <form th:action="@{/view/medicamentos/save}" th:object="${producto}" method="post" class="space-y-8">

                    <input type="hidden" th:field="*{idProducto}"/>

                    <!-- Identificación -->
                    <div>
                        <h2 class="text-xs font-bold text-pharmacore-accent uppercase tracking-wider mb-4">Identificación</h2>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                            <div>
                                <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-2">Código Interno</label>
                                <input type="text" th:field="*{codigoInterno}" placeholder="Ej: MED-0001" class="w-full px-4 py-2.5 text-xs sm:text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-pharmacore-accent transition-all">
                                <p class="text-red-500 text-[11px] mt-1" th:if="${#fields.hasErrors('codigoInterno')}" th:errors="*{codigoInterno}"></p>
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-2">Código de Barras</label>
                                <input type="text" th:field="*{codigoBarras}" placeholder="Ej: 7701234567890" class="w-full px-4 py-2.5 text-xs sm:text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-pharmacore-accent transition-all">
                                <p class="text-red-500 text-[11px] mt-1" th:if="${#fields.hasErrors('codigoBarras')}" th:errors="*{codigoBarras}"></p>
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-2">Nombre Comercial</label>
                                <input type="text" th:field="*{nombreComercial}" placeholder="Ej: Dolex" class="w-full px-4 py-2.5 text-xs sm:text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-pharmacore-accent transition-all">
                                <p class="text-red-500 text-[11px] mt-1" th:if="${#fields.hasErrors('nombreComercial')}" th:errors="*{nombreComercial}"></p>
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-2">Nombre Genérico</label>
                                <input type="text" th:field="*{nombreGenerico}" placeholder="Ej: Acetaminofén" class="w-full px-4 py-2.5 text-xs sm:text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-pharmacore-accent transition-all">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-2">Presentación</label>
                                <input type="text" th:field="*{presentacion}" placeholder="Ej: Caja x 20 tabletas" class="w-full px-4 py-2.5 text-xs sm:text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-pharmacore-accent transition-all">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-2">Concentración</label>
                                <input type="text" th:field="*{concentracion}" placeholder="Ej: 500 mg" class="w-full px-4 py-2.5 text-xs sm:text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-pharmacore-accent transition-all">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-2">Laboratorio</label>
                                <input type="text" th:field="*{laboratorio}" placeholder="Ej: GenFar" class="w-full px-4 py-2.5 text-xs sm:text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-pharmacore-accent transition-all">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-2">Registro INVIMA</label>
                                <input type="text" th:field="*{registroInvima}" placeholder="Ej: INVIMA 2020M-0001234" class="w-full px-4 py-2.5 text-xs sm:text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-pharmacore-accent transition-all">
                                <p class="text-red-500 text-[11px] mt-1" th:if="${#fields.hasErrors('registroInvima')}" th:errors="*{registroInvima}"></p>
                            </div>
                        </div>
                        <div class="mt-6">
                            <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-2">Descripción</label>
                            <textarea th:field="*{descripcion}" rows="3" placeholder="Notas adicionales sobre el medicamento..." class="w-full px-4 py-2.5 text-xs sm:text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-pharmacore-accent transition-all"></textarea>
                        </div>
                    </div>

                    <!-- Clasificación -->
                    <div class="pt-6 border-t border-slate-100">
                        <h2 class="text-xs font-bold text-pharmacore-accent uppercase tracking-wider mb-4">Clasificación</h2>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                            <div>
                                <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-2">Categoría</label>
                                <select th:field="*{categoria}" class="w-full px-4 py-2.5 text-xs sm:text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-pharmacore-accent transition-all">
                                    <option value="">Seleccione una categoría</option>
                                    <option th:each="c : ${categorias}" th:value="${c.id_categoria}" th:text="${c.nombre}"></option>
                                </select>
                                <p class="text-red-500 text-[11px] mt-1" th:if="${#fields.hasErrors('categoria')}" th:errors="*{categoria}"></p>
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-2">Proveedor</label>
                                <select th:field="*{proveedor}" class="w-full px-4 py-2.5 text-xs sm:text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-pharmacore-accent transition-all">
                                    <option value="">Seleccione un proveedor</option>
                                    <option th:each="p : ${proveedores}" th:value="${p.id_proveedor}" th:text="${p.razon_social}"></option>
                                </select>
                                <p class="text-red-500 text-[11px] mt-1" th:if="${#fields.hasErrors('proveedor')}" th:errors="*{proveedor}"></p>
                            </div>
                        </div>
                    </div>

                    <!-- Precios e inventario -->
                    <div class="pt-6 border-t border-slate-100">
                        <h2 class="text-xs font-bold text-pharmacore-accent uppercase tracking-wider mb-4">Precios e Inventario</h2>
                        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
                            <div>
                                <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-2">Precio Compra</label>
                                <input type="number" step="0.01" th:field="*{precioCompra}" class="w-full px-4 py-2.5 text-xs sm:text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-pharmacore-accent transition-all">
                                <p class="text-red-500 text-[11px] mt-1" th:if="${#fields.hasErrors('precioCompra')}" th:errors="*{precioCompra}"></p>
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-2">Precio Venta</label>
                                <input type="number" step="0.01" th:field="*{precioVenta}" class="w-full px-4 py-2.5 text-xs sm:text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-pharmacore-accent transition-all">
                                <p class="text-red-500 text-[11px] mt-1" th:if="${#fields.hasErrors('precioVenta')}" th:errors="*{precioVenta}"></p>
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-2">Stock Total</label>
                                <input type="number" th:field="*{stockTotal}" class="w-full px-4 py-2.5 text-xs sm:text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-pharmacore-accent transition-all">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-2">Stock Mínimo</label>
                                <input type="number" th:field="*{stockMinimo}" class="w-full px-4 py-2.5 text-xs sm:text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-pharmacore-accent transition-all">
                            </div>
                        </div>
                        <div class="mt-6">
                            <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-2">Ubicación en Estante</label>
                            <input type="text" th:field="*{ubicacionEstante}" placeholder="Ej: Estante A - Nivel 2" class="w-full sm:w-1/2 px-4 py-2.5 text-xs sm:text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-pharmacore-accent transition-all">
                        </div>
                    </div>

                    <!-- Condiciones de venta -->
                    <div class="pt-6 border-t border-slate-100">
                        <h2 class="text-xs font-bold text-pharmacore-accent uppercase tracking-wider mb-4">Condiciones de Venta</h2>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            <label class="flex items-center gap-3 text-xs sm:text-sm bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 cursor-pointer">
                                <input type="checkbox" th:field="*{esVentaLibre}" class="w-4 h-4 accent-pharmacore-accent">
                                Es venta libre
                            </label>
                            <label class="flex items-center gap-3 text-xs sm:text-sm bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 cursor-pointer">
                                <input type="checkbox" th:field="*{requiereFormula}" class="w-4 h-4 accent-pharmacore-accent">
                                Requiere fórmula médica
                            </label>
                            <label class="flex items-center gap-3 text-xs sm:text-sm bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 cursor-pointer">
                                <input type="checkbox" th:field="*{esControlado}" class="w-4 h-4 accent-pharmacore-accent">
                                Uso controlado
                            </label>
                            <label class="flex items-center gap-3 text-xs sm:text-sm bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 cursor-pointer">
                                <input type="checkbox" th:field="*{requiereRefrigeracion}" class="w-4 h-4 accent-pharmacore-accent">
                                Requiere refrigeración
                            </label>
                        </div>
                        <div class="mt-6">
                            <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-2">Restricciones de Venta</label>
                            <input type="text" th:field="*{restriccionesVenta}" placeholder="Ej: Máximo 2 unidades por cliente" class="w-full px-4 py-2.5 text-xs sm:text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-pharmacore-accent transition-all">
                        </div>
                        <div class="mt-6 sm:w-1/2">
                            <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-2">Estado</label>
                            <select th:field="*{estado}" class="w-full px-4 py-2.5 text-xs sm:text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-pharmacore-accent transition-all">
                                <option value="ACTIVO">ACTIVO</option>
                                <option value="INACTIVO">INACTIVO</option>
                                <option value="DESCONTINUADO">DESCONTINUADO</option>
                            </select>
                        </div>
                    </div>

                    <!-- Botones de Acción -->
                    <div class="flex items-center justify-end gap-3 pt-4 border-t border-slate-100">
                        <a th:href="@{/view/medicamentos}" class="px-5 py-2.5 rounded-xl text-xs font-semibold text-slate-600 bg-slate-100 hover:bg-slate-200 transition-colors">
                            Cancelar
                        </a>
                        <button type="submit" class="px-5 py-2.5 rounded-xl text-xs font-semibold text-white bg-pharmacore-accent hover:opacity-90 transition-opacity cursor-pointer">
                            Guardar Medicamento
                        </button>
                    </div>

                </form>
            </div>

        </main>

        <footer th:replace="~{fragments/layout :: footer}"></footer>
    </div>
</div>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
