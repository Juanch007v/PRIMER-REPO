<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="fragments/layout :: styles"></th:block>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PharmaCore - Detalle de Venta</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" th:href="@{/img/img.png}">
    <script>
        tailwind.config = {
            theme: { extend: { colors: { pharmacore: { bg:'#F7FAF9', dark:'#004B4B', darker:'#003939', accent:'#006565', text:'#1E1E1E' } }, fontFamily: { sans: ['Poppins','sans-serif'] } } }
        }
    </script>
</head>
<body class="bg-pharmacore-bg font-sans text-pharmacore-text antialiased min-h-screen flex flex-col selection:bg-pharmacore-accent selection:text-white">

<header th:replace="~{fragments/layout :: topbar('Detalle de Venta')}"></header>

<div class="flex flex-1 relative min-h-[calc(100vh-4rem)]">
    <div id="overlay" onclick="toggleSidebar()" class="fixed inset-0 bg-slate-900/60 z-10 hidden md:hidden transition-all duration-300"></div>
    <aside th:replace="~{fragments/layout :: sidebar('ventas')}"></aside>

    <div class="flex-1 flex flex-col min-w-0 bg-pharmacore-bg">
        <main class="flex-1 p-4 sm:p-6 lg:p-8 max-w-4xl mx-auto w-full">

            <div class="mb-6 flex items-center justify-between">
                <div>
                    <h1 class="text-xl sm:text-2xl font-bold text-pharmacore-dark uppercase tracking-wide" th:text="'FACTURA ' + ${venta.numeroFactura}"></h1>
                    <p class="text-xs sm:text-sm text-slate-500" th:text="${#temporals.format(venta.fechaVenta, 'dd/MM/yyyy HH:mm')}"></p>
                </div>
                <div class="flex gap-2 ">
                    <a th:href="@{/view/ventas/detalle/{id}/factura-pdf(id=${venta.idVenta})}"
                       class="bg-pharmacore-accent text-white px-4 py-2 rounded-xl text-xs font-semibold hover:opacity-90 transition-opacity">
                        ⬇ Descargar Factura PDF</a>
                    <form th:if="${venta.estado == 'PAGADA'}" th:action="@{/view/ventas/anular/{id}(id=${venta.idVenta})}" method="post">
                        <button type="submit" class="bg-red-100 text-red-700 px-4 py-2 rounded-xl text-xs font-semibold hover:bg-red-200 transition-colors"
                                onclick="return confirm('¿Anular esta venta? Esto devuelve el stock a los lotes originales.');">
                            ✕ Anular Venta
                        </button>
                    </form>
                    <a th:href="@{/view/dispensacion/historial}" class="bg-slate-200 text-slate-700 px-4 py-2 rounded-xl text-xs font-semibold hover:bg-slate-300 transition-colors">← Volver</a>
                </div>
            </div>

            <div th:if="${mensaje}" class="bg-emerald-50 text-emerald-700 border border-emerald-200 p-3 mb-4 rounded-xl text-sm" th:text="${mensaje}"></div>
            <div th:if="${error}" class="bg-red-50 text-red-700 border border-red-200 p-3 mb-4 rounded-xl text-sm" th:text="${error}"></div>

            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 mb-6 grid grid-cols-2 sm:grid-cols-4 gap-4 text-xs">
                <div><span class="text-slate-400 block">Cliente</span><span class="font-semibold" th:text="${venta.idCliente != null ? (nombresClientes.get(venta.idCliente) ?: ('Cliente #' + venta.idCliente)) : 'Sin cliente'}"></span></div>
                <div><span class="text-slate-400 block">Empleado</span><span class="font-semibold" th:text="${nombresEmpleados.get(venta.idEmpleado) ?: ('Empleado #' + venta.idEmpleado)}"></span></div>
                <div><span class="text-slate-400 block">Método de Pago</span><span class="font-semibold" th:text="${venta.metodoPago}"></span></div>
                <div>
                    <span class="text-slate-400 block">Estado</span>
                    <span th:text="${venta.estado}"
                          th:classappend="${venta.estado == 'PAGADA'} ? 'bg-emerald-100 text-emerald-700' : (${venta.estado == 'ANULADA'} ? 'bg-red-100 text-red-700' : 'bg-slate-200 text-slate-600')"
                          class="inline-block px-2 py-0.5 rounded-full text-[10px] font-semibold"></span>
                </div>
            </div>

            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                <table class="w-full text-sm text-left">
                    <thead class="bg-pharmacore-dark text-white text-xs uppercase tracking-wider">
                    <tr>
                        <th class="p-4">Producto</th>
                        <th class="p-4">Lote</th>
                        <th class="p-4">Cantidad</th>
                        <th class="p-4">Precio Unitario</th>
                        <th class="p-4">Subtotal</th>
                        <th class="p-4">Fórmula</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:if="${#lists.isEmpty(detalles)}">
                        <td colspan="6" class="p-6 text-center text-slate-400 text-xs">Esta venta no tiene líneas registradas.</td>
                    </tr>
                    <tr th:each="d : ${detalles}" class="border-b border-slate-100">
                        <td class="p-4 text-xs" th:text="${nombresProductos.get(d.idProducto) ?: ('Producto #' + d.idProducto)}"></td>
                        <td class="p-4 text-xs" th:text="${nombresLotes.get(d.idLote) ?: ('Lote #' + d.idLote)}"></td>
                        <td class="p-4 text-xs" th:text="${d.cantidad}"></td>
                        <td class="p-4 text-xs" th:text="${'$' + #numbers.formatDecimal(d.precioUnitario, 0, 'COMMA', 0, 'POINT')}"></td>
                        <td class="p-4 text-xs font-semibold" th:text="${'$' + #numbers.formatDecimal(d.subtotal, 0, 'COMMA', 0, 'POINT')}"></td>
                        <td class="p-4 text-xs">
                            <span th:if="${d.idDetalleFormula != null}" class="inline-block px-2 py-0.5 rounded-full text-[10px] font-semibold bg-purple-100 text-purple-700" th:text="${'Fórmula #' + d.idDetalleFormula}"></span>
                            <span th:if="${d.idDetalleFormula == null}" class="text-slate-400">—</span>
                        </td>
                    </tr>
                    </tbody>
                </table>
                <div class="p-6 border-t border-slate-100 flex justify-end">
                    <div class="text-sm space-y-1 text-right">
                        <div>Subtotal: <span class="font-semibold" th:text="${'$' + #numbers.formatDecimal(venta.subtotal, 0, 'COMMA', 0, 'POINT')}"></span></div>
                        <div>Descuento: <span class="font-semibold" th:text="${'$' + #numbers.formatDecimal(venta.descuento, 0, 'COMMA', 0, 'POINT')}"></span></div>
                        <div>IVA: <span class="font-semibold" th:text="${'$' + #numbers.formatDecimal(venta.impuestoIva, 0, 'COMMA', 0, 'POINT')}"></span></div>
                        <div class="text-pharmacore-dark font-bold text-base">Total: <span th:text="${'$' + #numbers.formatDecimal(venta.total, 0, 'COMMA', 0, 'POINT')}"></span></div>
                    </div>
                </div>
            </div>

        </main>
        <footer th:replace="~{fragments/layout :: footer}"></footer>
    </div>
</div>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
